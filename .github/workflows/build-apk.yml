name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q -o Sverige_Valvaka_2026_Android_Project_v3.zip -x '.github/*'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build map assets from Valmyndigheten
        run: |
          python -m pip install --upgrade pip
          python -m pip install shapely pyproj
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/geo app/src/main/assets/www/static
          python tools/build_geo.py --out app/src/main/assets/geo

      - name: Copy web UI and bundle MapLibre
        run: |
          cp web/index.html app/src/main/assets/www/index.html
          cp web/static/styles.css app/src/main/assets/www/static/styles.css
          cp web/static/app.js app/src/main/assets/www/static/app.js
          curl --fail --location --retry 3             https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js             --output app/src/main/assets/www/static/maplibre-gl.js
          curl --fail --location --retry 3             https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css             --output app/src/main/assets/www/static/maplibre-gl.css

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sverige-Valvaka-2026-v3.0-debug.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sverige-Valvaka-2026-APK
          path: dist/Sverige-Valvaka-2026-v3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
